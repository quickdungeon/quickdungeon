# Public server with automatic HTTPS (Let's Encrypt). Point DNS at the server first, then:
#   SITE_ADDRESS=quickdungeon.com docker compose -f compose.yaml -f compose.https.yaml up -d --build
# Certificates are kept in the caddy-data volume so restarts don't re-issue them.
services:
  web:
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to your domain, e.g. quickdungeon.com}
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
