# Build the site and deploy it to Cloudflare (https://quickdungeon.app) on every push to
# mainline that changes it. Run it by hand from the Actions tab with "Run workflow".
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# See "Deploy from GitHub" in README.md.
name: Deploy

on:
  push:
    branches: [mainline]
    paths:
      - "site/**"
      - Dockerfile
      - wrangler.jsonc
      - tools/deploy-cloudflare.sh
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in push order.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://quickdungeon.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Same build as the Docker image (Hugo warnings fail it), then wrangler deploy.
      - name: Build and deploy
        run: tools/deploy-cloudflare.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
